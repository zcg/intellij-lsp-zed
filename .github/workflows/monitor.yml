name: Monitor extension health

on:
  schedule:
    # Weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce extension runtime logic
        id: check
        run: |
          set -e
          TMP=$(mktemp -d)
          cd "$TMP"

          echo "== Step 1-4: For each platform, verify the full download chain =="
          # The extension resolves the platform via `openvsx_platform()` and
          # requests the platform-specific endpoint — NOT `/latest`, which
          # defaults to `darwin-arm64`. Verify every published platform so a
          # missing build is caught before users hit it.
          for PLATFORM in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "---- Platform: $PLATFORM ----"

            echo "== Fetch Open VSX API =="
            curl -fsSL -o "meta-$PLATFORM.json" "https://open-vsx.org/api/JetBrains/intellij-server/$PLATFORM/latest" \
              || { echo "FAILED: Open VSX API unreachable for $PLATFORM"; exit 1; }
            VSIX_URL=$(python3 -c "
import json
m = json.load(open('meta-$PLATFORM.json'))
print(m.get('files', {}).get('download', '') or m.get('download', ''))
" )
            [ -n "$VSIX_URL" ] || { echo "FAILED: no VSIX download URL for $PLATFORM"; exit 1; }
            echo "VSIX URL: $VSIX_URL"

            echo "== Download and extract VSIX =="
            curl -fsSL -o "vsix-$PLATFORM.zip" "$VSIX_URL" || { echo "FAILED: VSIX download for $PLATFORM"; exit 1; }
            rm -rf "vsix-$PLATFORM" && unzip -q "vsix-$PLATFORM.zip" -d "vsix-$PLATFORM" || { echo "FAILED: VSIX extraction for $PLATFORM"; exit 1; }
            [ -f "vsix-$PLATFORM/extension/server-bundle.json" ] || { echo "FAILED: server-bundle.json missing for $PLATFORM"; exit 1; }

            echo "== Read server-bundle.json =="
            SERVER_URL=$(python3 -c "
import json
b = json.load(open('vsix-$PLATFORM/extension/server-bundle.json'))
print(b['url'])
" ) || { echo "FAILED: bad server-bundle.json for $PLATFORM"; exit 1; }
            VERSION=$(python3 -c "
import json
b = json.load(open('vsix-$PLATFORM/extension/server-bundle.json'))
print(b['version'])
" )
            echo "Server version: $VERSION"
            echo "Server URL: $SERVER_URL"

            echo "== Verify server URL responds =="
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 "$SERVER_URL")
            echo "HTTP status: $STATUS"
            [ "$STATUS" = "200" ] || { echo "FAILED: server URL for $PLATFORM returned $STATUS"; exit 1; }

            # Use the last platform's version as the health-check version.
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          done

          echo "== All checks passed =="

      - name: Close stale health issues
        if: steps.check.outputs.version != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extension-broken'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Health check passed — this issue is being closed automatically.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Open issue if broken
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extension-broken'
            });
            if (issues.data.length > 0) {
              console.log('Issue already open — skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Extension health check failed — server download chain broken',
              body: `The weekly health check failed. This means the extension will not be able to auto-download the IntelliJ LSP server.

            **Possible causes:**
            - JetBrains changed the Open VSX API response format
            - The VSIX structure changed (server-bundle.json moved/renamed)
            - The JetBrains CDN URL pattern changed
            - Server bundle requires a different download method

            **Run the failing step locally to see the error:**
            \`\`\`sh
            curl -sL "https://open-vsx.org/api/JetBrains/intellij-server/win32-x64/latest"
            \`\`\`

            **Fix:** update \`src/lib.rs\` accordingly, rebuild, and release.`,
              labels: ['extension-broken']
            });
