name: Monitor extension health

on:
  schedule:
    # The 1st and 15th of each month.
    - cron: '0 9 1,15 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned server and check for updates
        id: check
        run: |
          set -e
          # Developer tooling only — NOT the extension at runtime.
          #
          # The extension NEVER queries the Open VSX API.  This CI workflow
          # queries it *once every 2 weeks* (a single request from the
          # maintainer's CI) purely to detect when JetBrains publishes a new
          # build, so the maintainer can bump the pins.  This is the same
          # traffic as a human opening the Open VSX web page in a browser
          # once every 2 weeks — not bulk, not automated per-user-install.
          echo "== Fetch Open VSX API (maintainer tooling, 1 req/2 weeks) =="
          META=$(curl -fsSL --max-time 60 "https://open-vsx.org/api/JetBrains/intellij-server/latest")
          if [ -z "$META" ]; then
            echo "FAILED: Open VSX API returned empty response"
            exit 1
          fi

          # Extract the *extension* version (the vsix wrapper version).
          # NOTE: keep this as a single line — a multi-line `python3 -c` would
          # carry the YAML indentation into the Python source and fail with
          # `IndentationError: unexpected indent`.
          NEWEST=$(python3 -c "import json,sys; m=json.load(sys.stdin); print(m.get('version',''))" <<< "$META")
          if [ -z "$NEWEST" ]; then
            echo "FAILED: could not parse version from API response"
            echo "Raw response (truncated): ${META:0:500}"
            exit 1
          fi

          # The pinned *server* version lives in server-artifacts.json
          # (previously was a constant in src/lib.rs).
          PINNED=$(python3 -c "import json; print(json.load(open('server-artifacts.json'))['version'])")
          if [ -z "$PINNED" ]; then
            echo "WARNING: could not parse version from server-artifacts.json"
            echo "version=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Pinned server version: $PINNED"
          echo "Newest vsix version : $NEWEST"

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"

          # Verify the first pinned JetBrains CDN URL is still reachable.
          URL=$(python3 -c "import json; d=json.load(open('server-artifacts.json')); print(next(iter(d['platforms'].values()))['url'])")
          if [ -n "$URL" ]; then
            echo "== Verify pinned CDN URL =="
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -I -L --max-time 60 "$URL")
            echo "HTTP status: $STATUS"
            [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || {
              echo "FAILED: pinned CDN URL returned $STATUS"
              exit 1
            }
          fi

      - name: Open issue if a newer build is available
        if: steps.check.outputs.pinned != '' && steps.check.outputs.pinned != 'unknown' && steps.check.outputs.newest != '' && steps.check.outputs.newest != steps.check.outputs.pinned
        env:
          PINNED: ${{ steps.check.outputs.pinned }}
          NEWEST: ${{ steps.check.outputs.newest }}
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'update-available'
            });
            if (issues.data.length > 0) {
              console.log('Update issue already open — skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🆕 New IntelliJ LSP server build available',
              body: `A newer JetBrains vsix release is available: **${process.env.NEWEST}** (currently pinned server version: **${process.env.PINNED}**).

            This usually means a new server bundle is available.  Update the pins in \`src/lib.rs\`:
            - Download the new vsix for each platform from the Open VSX page (browser, one-off)
            - Extract \`extension/server-bundle.json\` from each and copy the \`url\`, \`version\`, and \`sha256\` into \`platform_artifact()\`
            - Rebuild \`extension.wasm\`, bump \`extension.toml\` / \`Cargo.toml\`, and release

            See README → "Updating the pinned server".`,
              labels: ['update-available']
            });

      - name: Close stale health issues
        if: success() && steps.check.outputs.pinned != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extension-broken'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Health check passed — this issue is being closed automatically.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Open issue if broken
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extension-broken'
            });
            if (issues.data.length > 0) {
              console.log('Issue already open — skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Extension health check failed',
              body: `The biweekly health check failed.  This means either the Open VSX API is unreachable/empty, the response format changed, or the pinned JetBrains CDN URL is dead.

            Check the failing step in the workflow run for the exact error.

            If the server download chain is broken, update the pins in \`server-artifacts.json\` (\`platform_artifact()\` for each platform).  See README → "Updating the pinned server".`,
              labels: ['extension-broken']
            });
