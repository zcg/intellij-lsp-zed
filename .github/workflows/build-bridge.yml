name: Build bridge binaries

# Builds the native Rust bridge (`bridge/`) for all 6 supported platforms and
# uploads the binaries to a GitHub Release. The extension downloads the right
# one on first launch from `releases/download/v<version>/`.
#
# Runs automatically when a release is published, or manually via
# `workflow_dispatch` (pick the release tag to attach the binaries to, e.g.
# `v0.3.0` — useful to backfill assets on an existing release).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to attach the bridge binaries to (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - platform: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
          - platform: macos-x86_64
            # GitHub retired the Intel macOS hosted runners (macos-13), so the
            # Intel build is cross-compiled on an Apple Silicon runner: the
            # bridge is pure Rust (no C dependencies), and rustc + clang on
            # arm64 can produce the x86_64-apple-darwin binary directly.
            runner: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - platform: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - platform: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      # aarch64 Linux needs a cross linker (x86_64 host).
      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build bridge
        working-directory: bridge
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          BIN=bridge/target/${{ matrix.target }}/release/intellij-lsp-bridge${{ matrix.ext }}
          ASSET=intellij-lsp-bridge-${{ matrix.platform }}-${VERSION}${{ matrix.ext }}
          cp "$BIN" "$ASSET"
          gh release upload "$VERSION" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
